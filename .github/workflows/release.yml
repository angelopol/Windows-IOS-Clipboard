name: Release Windows Agent

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: agent-win
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build ClipboardAgent.exe
        working-directory: agent-win
        run: pyinstaller --noconsole --onefile --name ClipboardAgent --hidden-import=pystray._win32 agent.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardAgent
          path: agent-win/dist/ClipboardAgent.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: agent-win/dist/ClipboardAgent.exe
          generate_release_notes: true
